server {
    listen 443 ssl;
    server_name oxidized.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/oxidized.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oxidized.yourdomain.com/privkey.pem;

    location / {
        proxy_pass http://oxidized:8888;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd;
    }
}
